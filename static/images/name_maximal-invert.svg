<svg
    xmlns="http://www.w3.org/2000/svg"
    width="80"
    height="70"
    viewBox="0 0 80 70"
    preserveAspectRatio="xMidYMin meet"
  >

  <style>
    svg {
      --dot-color: #223;
      --bg-color: #eee;
    }

    #lines2 {
      animation: r 20s linear infinite;
      transform-origin: 300px 100px;
    }

    #bg {
      fill: var(--bg-color);
    }

    .dot-stop {
      stop-color: var(--dot-color);
    }

    .full-size {
      x: 0;
      y: 0;
      width: 600px;
      height: 600px;
    }

    @keyframes r {
      0% { transform: rotate(0deg) translate(0px,0px); }
      33% { transform: rotate(0deg) translate(0.4px,0.8px); }
      66% { transform: rotate(0deg) translate(0.4px,1.2px); }
      100% { transform: rotate(0deg) translate(0.8px,1.2px); }
    }

    @keyframes r2 {
      0%   { animation-timing-function: ease; transform: rotate(0deg)  translate(0px, 0px); }
      15%  { animation-timing-function: ease; transform: rotate(0deg)  translate(4px, 4px); }
      45%  { animation-timing-function: ease; transform: rotate(0deg)  translate(20px, 12px); }
      85%  { animation-timing-function: ease; transform: rotate(0deg)  translate(8px, 8px); }
    }
  </style>

  <defs>
    <radialGradient id="dotFade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   class="dot-stop" stop-opacity="0.95"/>
      <stop offset="25%"  class="dot-stop" stop-opacity="0.95"/>
      <stop offset="50%"  class="dot-stop" stop-opacity="0.8"/>
      <stop offset="75%"  class="dot-stop" stop-opacity="0.6"/>
      <stop offset="100%" class="dot-stop" stop-opacity="0"/>
    </radialGradient>

    <pattern
      id="circTile"
      x="0" y="0"
      width="0.4" height="0.4"
      patternUnits="userSpaceOnUse"
    >
      <circle
        cx="0" cy="0.2" r="0.2"
        fill="url(#dotFade)"
      />
      <circle
        cx="0.4" cy="0.2" r="0.2"
        fill="url(#dotFade)"
      />
    </pattern>

    <pattern
      id="circTile2"
      x="0.2" y="0.2"
      width="0.4" height="0.4"
      patternUnits="userSpaceOnUse"
    >
      <circle
        cx="0" cy="0.2" r="0.2"
        fill="url(#dotFade)"
      />
      <circle
        cx="0.4" cy="0.2" r="0.2"
        fill="url(#dotFade)"
      />
    </pattern>

    <mask id="mMask">
      <rect x="0" y="0" width="120" height="120" fill="white" />
      <text
        x="40" y="7"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="7"
        font-weight="1000"
        text-anchor="middle"
        fill="black"
        stroke="black"
        stroke-width="0.2"
        stroke-linejoin="round"
      >Maximal</text>
      <text
        x="40" y="14"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="7"
        font-weight="1000"
        text-anchor="middle"
        fill="black"
        stroke="black"
        stroke-width="0.2"
        stroke-linejoin="round"
      >Intelligence</text>
    </mask>

  </defs>

  <rect id="bg" class="full-size"/>
  <rect
    id="lines1"
    x="0" y="0"
    width="600" height="600"
    fill="url(#circTile)"
  />

  <g mask="url(#mMask)">
    <rect
      id="lines2"
      x="-120" y="-120"
      width="240" height="240"
      fill="url(#circTile2)"
    />
  </g>

  </svg>
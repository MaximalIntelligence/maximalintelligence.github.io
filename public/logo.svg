<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 -70 240 227">
  <style>
    circle { r: var(--r); }
  </style>
  <defs>
    <g id="points">
      <circle cx="0" cy="87"/>
      <circle cx="50" cy="0"/>
      <circle cx="100" cy="87"/>
    </g>
    <mask id="m" x="-70" y="-70" width="240" height="227" style="--fg:white; --bg:black;">
      <use href="#points" fill="var(--fg)" style="--r: 70px;"/>
      <use href="#points" fill="var(--bg)" style="--r: 60px;"/>
      <use href="#points" fill="var(--fg)" style="--r: 48px;"/>
      <use href="#points" fill="var(--bg)" style="--r: 38px;"/>
      <use href="#points" fill="var(--fg)" style="--r: 26px;"/>
      <use href="#points" fill="var(--bg)" style="--r: 16px;"/>
    </mask>
  </defs>
  <rect x="-70" y="-70" width="240" height="227" fill="var(--color, #333)" mask="url(#m)"/>
</svg>
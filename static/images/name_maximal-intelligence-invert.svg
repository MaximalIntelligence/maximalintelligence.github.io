<svg
    xmlns="http://www.w3.org/2000/svg"
    width="80"
    height="70"
    viewBox="0 0 80 70"
    preserveAspectRatio="xMidYMin meet"
  >

  <style>
    svg {
      --dot-color: #223;
      --bg-color: #eee;
      --pattern-scale: 3;
    }

    text {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 900;
      text-anchor: middle;
      stroke-linejoin: round;
    }

    circle {
      <!-- fill: url(#dotFade); -->
      fill: var(--dot-color);
      r: 0.14;
    }

    pattern {
      transform: scale(var(--pattern-scale));
      transform-origin: 0 0;
    }

    #lines1 {
      animation: r1 14s linear infinite;
    }

    #lines2 {
      animation: r2 42s ease infinite;
    }

    #bg {
      fill: var(--bg-color);
    }

    .dot-stop {
      stop-color: var(--dot-color);
    }

    .full-size {
      x: 0;
      y: 0;
      width: 240px;
      height: 240px;
    }

    @keyframes r1 {
      0%   { transform: rotate(45deg); }
      50%  { transform: rotate(45deg); }
      100% { transform: rotate(45deg); }
    }

    @keyframes r2 {
      0%   { transform: rotate(45deg) translate(calc(0px * var(--pattern-scale)), calc(0px * var(--pattern-scale))); }
      50%  { transform: rotate(45deg) translate(calc(0.56px * var(--pattern-scale)), calc(0.56px * var(--pattern-scale))); }
      100% { transform: rotate(45deg) translate(calc(1.12px * var(--pattern-scale)), calc(0px * var(--pattern-scale))); }
    }
  </style>

  <defs>
    <radialGradient id="dotFade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   class="dot-stop" stop-opacity="0.95"/>
      <stop offset="25%"  class="dot-stop" stop-opacity="0.85"/>
      <stop offset="50%"  class="dot-stop" stop-opacity="0.7"/>
      <stop offset="75%"  class="dot-stop" stop-opacity="0.4"/>
      <stop offset="100%" class="dot-stop" stop-opacity="0"/>
    </radialGradient>

    <pattern
      id="circTile"
      x="0" y="0"
      width="0.56" height="0.56"
      patternUnits="userSpaceOnUse"
    >
      <circle cx="0.28" cy="0" />
      <circle cx="0" cy="0.28" />
      <circle cx="0.56" cy="0.28" />
      <circle cx="0.28" cy="0.56" />
    </pattern>

    <pattern
      id="circTile2"
      x="0.28" y="0"
      width="0.56" height="0.56"
      patternUnits="userSpaceOnUse"
    >
      <circle cx="0.28" cy="0" />
      <circle cx="0" cy="0.28" />
      <circle cx="0.56" cy="0.28" />
      <circle cx="0.28" cy="0.56" />
    </pattern>

    <mask id="maximal">
      <text x="40" y="7" fill="white" stroke="white" font-size="6" stroke-width="0.2">Maximal</text>
      <text x="40" y="14" fill="white" stroke="white" font-size="6" stroke-width="0.2">Intelligence</text>
    </mask>

    <mask id="maximal-border">
      <text x="40" y="7" fill="white" stroke="white" font-size="6" stroke-width="0.4">Maximal</text>
      <text x="40" y="14" fill="white" stroke="white" font-size="6" stroke-width="0.4">Intelligence</text>
      <text x="40" y="7" fill="black" stroke="black" font-size="6" stroke-width="0.2">Maximal</text>
      <text x="40" y="14" fill="black" stroke="black" font-size="6" stroke-width="0.2">Intelligence</text>
    </mask>

    <mask id="maximal-intelligence">
      <text x="40" y="7" fill="white" stroke="white" font-size="7" stroke-width="0.2">Maximal Intelligence</text>
    </mask>

    <mask id="maximal-intelligence-border">
      <text x="40" y="7" fill="white" stroke="white" font-size="7" stroke-width="0.4">Maximal Intelligence</text>
      <text x="40" y="7" fill="black" stroke="black" font-size="7" stroke-width="0.2">Maximal Intelligence</text>
    </mask>

  </defs>

  <rect id="bg" class="full-size"/>
  <g>
    <rect
      id="lines1"
      x="-120" y="-120"
      width="240" height="240"
      fill="url(#circTile)"
    />
  </g>

  <g>
    <rect
      id="lines2"
      x="-120" y="-120"
      width="240" height="240"
      fill="url(#circTile2)"
    />
  </g>

  <g mask="url(#maximal-intelligence)">
    <rect x="0" y="0" width="600" height="600" fill="white" opacity="0.9"/>
  </g>

  <g mask="url(#maximal-intelligence-border)">
    <rect class="full-size" fill="var(--dot-color)"/>
  </g>

  </svg>
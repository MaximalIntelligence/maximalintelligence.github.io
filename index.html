layout: main
title: Home
stylesheets:
- main

<div id="main">
    <section id="top"></section>
    <!-- Hero Section -->
    <section id="rest">
        <section id="call">
            <div id="message">
                <h1>Accelerate data-driven decision making with the maximal intelligence Knowledge Platform.</h1>

            </div>
            <div id="actions">
                <div class="header-buttons">
                    <a id="requestAccess" class="btn btn-login" href="mailto:support@maximalintelligence.com">Request Access</a>
                    <a id="demo" class="btn btn-get-started" href="mailto:support@maximalintelligence.com">Demo</a>
                </div>
                <div id="newsletter-component" style="max-width: 400px; padding: 20px; background: #eee; font-family: sans-serif; border: 1px solid #ccc; border-radius: 8px;">
                    <h3 style="margin-top: 0;">Sign Up For Updates</h3>
                    
                    <div style="display: flex; gap: 8px;">
                    <input 
                        type="email" 
                        id="email-input" 
                        placeholder="you@example.com" 
                        style="flex-grow: 1; padding: 8px; border: 1px solid #aaa; border-radius: 4px;"
                        required 
                    />
                    <button 
                        id="subscribe-btn" 
                        style="padding: 8px 16px; background: #000; color: #fff; border: none; border-radius: 4px; cursor: pointer;">
                        Subscribe
                    </button>
                    </div>
                    
                    <p id="status-message" style="font-size: 14px; margin-top: 12px; margin-bottom: 0; min-height: 20px;"></p>
                </div>
            </div>
        
        <script>
            document.getElementById('subscribe-btn').addEventListener('click', async () => {
            const emailInput = document.getElementById('email-input');
            const statusMessage = document.getElementById('status-message');
            const button = document.getElementById('subscribe-btn');
            const email = emailInput.value.trim();
        
            // 1. Basic frontend validation
            if (!email || !email.includes('@')) {
                statusMessage.textContent = 'Please enter a valid email address.';
                statusMessage.style.color = 'red';
                return;
            }
        
            // 2. Loading state
            statusMessage.textContent = 'Subscribing...';
            statusMessage.style.color = '#666';
            button.disabled = true;
        
            // 3. The API Call to Gunicorn
            try {
                const response = await fetch('https://newsletter-liart-gamma.vercel.app/api/subscribe', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email: email })
                });
        
                const data = await response.json();
        
                // 4. Handle the server response
                if (response.ok) {
                statusMessage.textContent = 'Success! You are on the list.';
                statusMessage.style.color = 'green';
                emailInput.value = ''; // Clear the input
                } else {
                // If the python email_validator throws an error, it shows here
                statusMessage.textContent = data.error || 'Something went wrong.';
                statusMessage.style.color = 'red';
                }
            } catch (error) {
                console.error('Network Error:', error);
                statusMessage.textContent = 'Network error. Is the Gunicorn server running?';
                statusMessage.style.color = 'red';
            } finally {
                // Re-enable the button no matter what happens
                button.disabled = false;
            }
            });
        </script>
        </section>
        {% include footer.html %}
    </section>

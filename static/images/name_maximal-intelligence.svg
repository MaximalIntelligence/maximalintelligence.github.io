<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1200"
    height="200"
    viewBox="0 0 1200 200"
    preserveAspectRatio="xMidYMid meet"
    filter="url(#blur)"
  >

  <style>
    #lines2 {
      animation: morphCircles 100s linear infinite;
      transform-origin: 300px 100px;
    }

    @keyframes morphLines {
      0%   { transform: rotate(-5deg)   translate(0px,   0px);   }
      5%   { transform: rotate(-5deg)   translate(0px,   0px);   }
      50%  { transform: rotate(5deg)  translate(0px,   0px);     }
      95%   { transform: rotate(-5deg)   translate(0px,   0px); }
      100%   { transform: rotate(-5deg)   translate(0px,   0px); }
    }

    @keyframes morphCirclesSpin {
      0%   { transform: rotate(10deg)   translate(0px,   0px);   }
      5%   { transform: rotate(10deg)   translate(0px,   0px);   }
      50%  { transform: rotate(35deg)  translate(0px,   0px);     }
      95%   { transform: rotate(60deg)   translate(0px,   0px); }
      100%   { transform: rotate(60deg)   translate(0px,   0px); }
    }

    @keyframes morphCircles {
      0%   { transform: rotate(4deg)   translate(0px,   0px);   }
      27%   { transform: rotate(2deg)   translate(20px,   40px); }
      50%   { transform: rotate(0.5deg)   translate(40px,   80px); }
      73%   { transform: rotate(2deg)   translate(60px,   120px); }
      100%   { transform: rotate(4deg)   translate(80px,   160px); }
    }
  </style>

    <defs>

      <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="0.6" />
      </filter>

      <pattern
        id="lineTile"
        x="0" y="0"
        width="5000" height="4"
        patternUnits="userSpaceOnUse"
      >
        <line
          x1="-500"   y1="2"
          x2="2000" y2="2"
          stroke="#e8e0d0"
          stroke-width="2"
          stroke-linecap="square"
        />
      </pattern>

      <pattern
        id="circTile"
        x="0" y="0"
        width="4" height="4"
        patternUnits="userSpaceOnUse"
      >
        <circle
          cx="1" cy="1" r="1"
          fill="#e8e0ff"
        />
        <circle
          cx="3" cy="3" r="1"
          fill="#e8e0ff"
        />
      </pattern>

      <!-- M clip path — fixed, never moves -->
      <clipPath id="mClip">
        <text
          x="600" y="140"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="120"
          font-weight="1000"
          text-anchor="middle"
          fill="white"
          stroke="white"
          stroke-width="15"
          stroke-linejoin="round"
        >Maximal Intelligence</text>
      </clipPath>

    </defs>

    <!-- lines1: static base, same rect dimensions and pattern as lines2 -->
    <rect
      id="lines1"
      x="0" y="0"
      width="1200" height="600"
      fill="url(#circTile)"
      opacity="0.9"
    />

    <!-- Clip group: the M window is fixed here via clip-path.
         lines2 (the rect inside) is what animates — lines move, M stays. -->
  <g clip-path="url(#mClip)">
    <rect
      id="lines2"
      x="-400" y="-300"
      width="2400" height="800"
      fill="url(#circTile)"
      opacity="0.9"
    />
  </g>

  </svg>
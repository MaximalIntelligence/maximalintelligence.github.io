---
layout: main
title: Home
stylesheets:
- main
---

<div id="main">
    <div class="page-bg" aria-hidden="true"></div>

    <div id="call">
        <section id="message" class="floating-section">
            <h1>Support your AI with big datasets.</h1>

            <video controls preload="metadata" width="100%" height="auto">
                <source src="/static/videos/final_video.webm" type="video/webm">
            </video>
        </section>

        <section id="actions">
            <div class="header-buttons floating-section">
                <a id="requestAccess" class="btn btn-login" target="_blank" href="mailto:support@maximalintelligence.com">Request Access</a>
            </div>
            <div id="newsletter-component" class="floating-section">
                <h3>Sign Up For Updates</h3>

                <div class="newsletter-input-row">
                    <input
                        type="email"
                        id="email-input"
                        placeholder="you@example.com"
                        required
                    />
                    <button id="subscribe-btn">Subscribe*</button>
                </div>

                <p class="newsletter-fineprint">*By clicking subscribe you agree to the <a href="/privacy">privacy policy</a></p>
                <p id="status-message"></p>
            </div>
        </section>
    </div>

    <script>
        document.getElementById('subscribe-btn').addEventListener('click', async () => {
        const emailInput = document.getElementById('email-input');
        const statusMessage = document.getElementById('status-message');
        const button = document.getElementById('subscribe-btn');
        const email = emailInput.value.trim();
    
        // 1. Basic frontend validation
        if (!email || !email.includes('@')) {
            statusMessage.textContent = 'Please enter a valid email address.';
            statusMessage.style.color = 'red';
            return;
        }
    
        // 2. Loading state
        statusMessage.textContent = 'Subscribing...';
        statusMessage.style.color = '#666';
        button.disabled = true;
    
        // 3. The API Call to Gunicorn
        try {
            const response = await fetch('https://newsletter-liart-gamma.vercel.app/api/subscribe', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ email: email })
            });
    
            const data = await response.json();
    
            // 4. Handle the server response
            if (response.ok) {
            statusMessage.textContent = 'Success! You are on the list.';
            statusMessage.style.color = 'green';
            emailInput.value = ''; // Clear the input
            } else {
            // If the python email_validator throws an error, it shows here
            statusMessage.textContent = data.error || 'Something went wrong.';
            statusMessage.style.color = 'red';
            }
        } catch (error) {
            console.error('Network Error:', error);
            statusMessage.textContent = 'Network error. Is the Gunicorn server running?';
            statusMessage.style.color = 'red';
        } finally {
            // Re-enable the button no matter what happens
            button.disabled = false;
        }
        });
    </script>

    {% include footer.html %}
</div>
